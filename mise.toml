[tools]
rust = { version = "1.96.1", components = "clippy,rustfmt" }

[tasks.test]
description = "Every test"
run = "cargo test --locked"

[tasks."test:slow"]
description = "The real-time tests left out of `test` (about three minutes)"
run = "cargo test --locked -- --ignored"

[tasks.check]
description = "Fail on unformatted code or any clippy warning"
run = [
  "cargo fmt --check",
  "cargo clippy --locked --all-targets -- -D warnings",
]

[tasks.image]
description = "Build the container image (needs Podman)"
run = "podman build -t crumb ."
